spring:
  application:
    name: nexusops-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/nexusops}
    username: ${SPRING_DATASOURCE_USERNAME:nexusops}
    password: ${SPRING_DATASOURCE_PASSWORD}
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

nexusops:
  version: ${NEXUSOPS_VERSION:0.1.0}
  security:
    jwt-secret: ${NEXUSOPS_JWT_SECRET}
    access-token-minutes: ${NEXUSOPS_ACCESS_TOKEN_MINUTES:15}
    refresh-token-days: ${NEXUSOPS_REFRESH_TOKEN_DAYS:30}

