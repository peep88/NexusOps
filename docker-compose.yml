services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexusops}
      POSTGRES_USER: ${POSTGRES_USER:-nexusops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-nexusops} -d $${POSTGRES_DB:-nexusops}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-nexusops}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-nexusops}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

  agent:
    profiles: ["agent"]
    build:
      context: ./agent
    environment:
      NEXUSOPS_SERVER_URL: http://backend:8080
      NEXUSOPS_AGENT_ID: ${NEXUSOPS_AGENT_ID:-}
      NEXUSOPS_AGENT_CREDENTIAL: ${NEXUSOPS_AGENT_CREDENTIAL:-}
      NEXUSOPS_COLLECTION_INTERVAL_SECONDS: ${NEXUSOPS_COLLECTION_INTERVAL_SECONDS:-30}
    depends_on:
      - backend

volumes:
  postgres-data:

